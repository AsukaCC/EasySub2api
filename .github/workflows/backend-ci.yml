name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: Build backend
        working-directory: backend
        run: go build ./...
      - name: Compile backend unit tests
        working-directory: backend
        run: go test -tags=unit ./... -run '^$' -timeout=10m
      - name: Gateway and admin regression tests
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/service ./internal/handler/admin
          -run 'TestOpenAISetupToken|TestAdminStats|TestRedeemExport|TestForwardAsAnthropic_|TestForwardAsChatCompletions_|TestResolveAndSetOpenAIChatGPTAccountHeaders|TestMergeOpenAIUsage|Test.*(ForwardImages|OpenAIImage|CodexDirectImages)'
          -count=1 -timeout=10m
      - name: Account protection and retired model regression tests
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/pkg/openai ./internal/pkg/tlsfingerprint
          ./internal/service ./internal/handler ./internal/handler/admin ./internal/server/routes
          -run 'Test(Retired|Protection|LocalTLS|StickyEscape|GatewayPlatformIsolation)'
          -count=1 -timeout=10m

      - name: Release 0.2.19 adaptation regressions
        working-directory: backend
        run: |
          release_tests='TestRelease0219|TestScopedAdmin|TestLegacyAdminKey|TestGrok(Catalog|ModelDiagnostics|ResponseAudit)|TestGetGrokModelDiagnostics|TestGPT61Terra'
          release_tests+='|TestGeminiForward_SameAccountRetriesFollowConfig|TestGeminiClaudeCompat_SignatureDowngradeDoesNotConsumeSameAccountRetries'
          release_tests+='|Test.*ImageCountBilling|TestResolveBillableImageCount|TestResolveGeminiImageCount|Test.*GeminiImageOutput|Test.*FileDataImageBilling|TestHandleNativeNonStreamingResponse_FeedsImageCounter'
          release_tests+='|TestCalculateRecordUsageCost_ChannelPerRequestContextTierUsesTokens|TestCountOpenAIImageOutputs_OfficialMultiImageResponse|Test.*Multipart.*(PartLimit|Above20MB)'
          release_tests+='|TestCNProvider(QuotaSnapshotNearExhausted|ResponseIndicatesFrequencyLimit)|TestHandleUpstreamError_Zhipu(Frequency429|InsufficientBalance429|QuotaWorded429)'
          release_tests+='|Test.*(DeepSeekPromptCache|StrictChatDeveloper|StrictDeveloperRole|WebSearchEmulation|MalformedFunctionCall|JavaScriptUTF16)|TestPaginationParamsOffsetDoesNotOverflow|TestParsePaginationBoundariesAndResponse'
          release_tests+='|TestDefaultModels_Contains|TestGoogleOneModels_ExcludeUnsupportedNewAndImageModels|TestHasFallbackModel_RecognizesCustomtoolsModel|TestExtractUpstreamModelIDsIgnoresGrokCatalogRules'
          release_tests+='|TestLockAndMergeAccountProbeExtraKeepsLatestGrokManagedKeys|TestSyncGrokObservedModelsUsesCLIIdentityAndAccountHeaders|TestUpstreamModelCatalog(PersistsAcrossServicesAndKeyChanges|SyncRefreshesIncompleteModelsAndPreservesOnFailure)'
          go test -tags=unit ./internal/service ./internal/repository \
            ./internal/handler/admin ./internal/server/middleware \
            ./internal/pkg/adminaccess ./internal/pkg/pagination ./internal/pkg/response \
            ./internal/pkg/antigravity ./internal/pkg/gemini ./internal/pkg/geminicli \
            -run "$release_tests" -count=1 -timeout=10m

      - name: Account scheduling before conversation affinity
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/service
          -run 'Test(GatewaySchedulingBeforeAffinity|OpenAILegacySchedulingBeforeAffinity|OpenAIAdvancedSchedulingBeforeAffinity|GeminiCompatSchedulingBeforeAffinity|OpenAIBaseSchedulingUnaffectedByAffinity|OpenAISubscriptionPoolBeforeAffinity|OpenAISchedulerScoreReportsAffinityWithinTier)'
          -count=1 -timeout=5m

      - name: Wallet, fingerprint, and upstream compatibility regressions
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/service ./internal/repository ./internal/handler
          ./internal/handler/admin ./internal/server/routes ./internal/pkg/modeltrace
          ./internal/pkg/typesafe ./internal/securityaudit ./migrations
          -run 'Test.*(Wallet|Refund|Payment|PointChange|ModelFingerprint|UpstreamParity|TypeSafe|SystemOne|Inflight|Release0211|GPT61|UpstreamBillingProbe|UsageBilling|DynamicRateBilling|Email.*Token|Reset.*Token|GrokChat|Grok.*Header|PromptSnapshot)'
          -count=1 -timeout=10m

  release0219-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Release 0.2.19 migrations and wallet regressions
        working-directory: backend
        env:
          SUB2API_TEST_POSTGRES_IMAGE: postgres:16-alpine
        run: python3 scripts/test-release0219-integration.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint:check
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend auth and API regression tests
        working-directory: frontend
        run: pnpm run test:ci
      - name: Frontend protection and billing regression tests
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/components/account/__tests__/AccountProtectionPanel.spec.ts
          src/i18n/__tests__/compileMessages.spec.ts
          src/components/keys/__tests__/UseKeyModal.spec.ts
          src/views/user/__tests__/UsageView.spec.ts
          src/utils/__tests__/siteBillingMode.spec.ts
          src/utils/__tests__/ccswitchImport.spec.ts
          src/composables/__tests__/useModelWhitelist.spec.ts
      - name: Wallet and model testing regressions
        working-directory: frontend
        run: >-
          pnpm exec vitest run src/components/payment/__tests__
          src/components/admin/account/__tests__/ModelFingerprintModal.spec.ts
          src/components/admin/user/__tests__/UserBalanceModal.spec.ts
          src/components/admin/user/__tests__/UserPlatformQuotaModal.spec.ts
          src/components/account/__tests__/credentialsBuilder.spec.ts
          src/components/account/__tests__/AccountPriorityCell.spec.ts
          src/components/account/__tests__/ClaudeResetCreditsCell.spec.ts
          src/components/keys/__tests__/UseKeyModal.typesafe.spec.ts
          src/components/keys/__tests__/UseKeyModal.catalog.spec.ts
          src/views/admin/__tests__/UsageView.spec.ts
          src/api/__tests__/codex.spec.ts

      - name: Release 0.2.19 admin feature regressions
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/components/admin/settings/__tests__/AdminAccessKeysSettings.spec.ts
          src/components/account/__tests__/GrokModelDiagnosticsPanel.spec.ts
          src/views/admin/__tests__/ChannelsView.webSearchEmulation.spec.ts

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m --tests=false
          working-directory: backend
