name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Build backend
        working-directory: backend
        run: go build ./...
      - name: Compile backend unit tests
        working-directory: backend
        run: go test -tags=unit ./... -run '^$' -timeout=10m
      - name: Gateway and admin regression tests
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/service ./internal/handler/admin
          -run 'TestOpenAISetupToken|TestAdminStats|TestRedeemExport|TestForwardAsAnthropic_|TestForwardAsChatCompletions_|TestResolveAndSetOpenAIChatGPTAccountHeaders|TestMergeOpenAIUsage|Test.*(ForwardImages|OpenAIImage|CodexDirectImages)'
          -count=1 -timeout=10m
      - name: Account protection and retired model regression tests
        working-directory: backend
        run: >-
          go test -tags=unit ./internal/pkg/openai ./internal/pkg/tlsfingerprint
          ./internal/service ./internal/handler ./internal/handler/admin ./internal/server/routes
          -run 'Test(Retired|Protection|LocalTLS|StickyEscape|GatewayPlatformIsolation)'
          -count=1 -timeout=10m

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        working-directory: frontend
        run: pnpm run lint:check
      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Frontend auth and API regression tests
        working-directory: frontend
        run: pnpm run test:ci
      - name: Frontend protection and billing regression tests
        working-directory: frontend
        run: >-
          pnpm exec vitest run
          src/components/account/__tests__/AccountProtectionPanel.spec.ts
          src/i18n/__tests__/compileMessages.spec.ts
          src/components/keys/__tests__/UseKeyModal.spec.ts
          src/views/user/__tests__/UsageView.spec.ts
          src/utils/__tests__/siteBillingMode.spec.ts
          src/utils/__tests__/ccswitchImport.spec.ts
          src/composables/__tests__/useModelWhitelist.spec.ts

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=30m --tests=false
          working-directory: backend
